[project]
name = "travel-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Josephine Nantege", email = "nantegejosephine1996@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[project.scripts]
travel-project = "travel_project:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
